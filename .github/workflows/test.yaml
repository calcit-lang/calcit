on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

jobs:
  macos_main_thread:
    name: macOS main-thread CLI
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --bin calcit
      - name: Verify the reserved process-main stack
        run: |
          stacksize=$(otool -l target/debug/calcit | awk '/cmd LC_MAIN/{main=1} main && /stacksize/{print $2; exit}')
          test "$stacksize" = "33554432"
      - run: ./target/debug/calcit -v

  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo test
        env:
          RUST_MIN_STACK: "16777216"
      - name: "check wasm32 library dependency boundary"
        run: cargo check --lib --target wasm32-unknown-unknown
      - name: "run definition-attached core tests"
        run: cargo run --bin calcit -- src/cirru/calcit-core.cirru test --tag unit
      - name: "prevent bundled core type-debt regressions"
        run: cargo run --bin calcit -- src/cirru/calcit-core.cirru analyze quality --baseline config/calcit-core-quality.json --format json
      - run: cargo run --bin calcit -- calcit/test.cirru

      - name: "verify WASM exports and FFI"
        run: >
          cargo build --bin cr-wasm
          && CR_WASM_BIN="./target/debug/cr-wasm" bash scripts/test-wasm.sh

      - uses: giraffate/clippy-action@v1
        with:
          reporter: "github-pr-review"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: "check docs markdown"
        run: bash scripts/check-docs-md.sh
        env:
          RUST_MIN_STACK: "16777216"

      - name: "try js"
        run: >
          yarn
          && yarn tsc
          && cargo run --bin calcit -- calcit/test.cirru js
          && ln -s ../../ node_modules/@calcit/procs
          && cp -v scripts/main.mjs js-out/
          && node js-out/main.mjs

      - name: Deploy CalcitAgent.md to server
        id: deploy
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "docs/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}/docs"

      - name: Display status from deploy
        run: echo "${{ steps.deploy.outputs.status }}"
