on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  wasi_preprocess:
    name: WASI preprocess regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Install Wasmtime 18.0.3
        uses: bytecodealliance/actions/wasmtime/setup@v1.1.3
        with:
          version: "18.0.3"
      - name: Verify native and WASI preprocessing parity
        run: bash scripts/test-wasi-preprocess.sh
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prepare JS runtime for the shared business fixture
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn
          yarn compile
          mkdir -p node_modules/@calcit
          ln -s ../../ node_modules/@calcit/procs
      - name: Verify typed manifest business fixture across native, JS, and Preview 1
        run: bash scripts/test-wasi-manifest-business.sh

  wasi03_command_smoke:
    name: WASI 0.3 command Component smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install Wasmtime 49.0.0 with verified digest
        run: |
          curl --fail --location --silent --show-error \
            'https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.0/wasmtime-v49.0.0-x86_64-linux.tar.xz' \
            --output "$RUNNER_TEMP/wasmtime-v49.0.0-x86_64-linux.tar.xz"
          echo "a956c279ac6e80109369a285db30fc46f68239fa1bbeb03ccfa8e913bbca85fc  $RUNNER_TEMP/wasmtime-v49.0.0-x86_64-linux.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/wasmtime-v49.0.0-x86_64-linux.tar.xz" -C "$RUNNER_TEMP"
      - name: Run Calcit and Wasmtime command smoke
        run: |
          WASMTIME_CLI="$RUNNER_TEMP/wasmtime-v49.0.0-x86_64-linux/wasmtime" \
            cargo test --test wasi_command_component_cli
          WASMTIME_CLI="$RUNNER_TEMP/wasmtime-v49.0.0-x86_64-linux/wasmtime" \
            cargo test --lib wasi_03_select_preopen_runs_with_real_wasmtime_host
          WASMTIME_CLI="$RUNNER_TEMP/wasmtime-v49.0.0-x86_64-linux/wasmtime" \
            cargo test --lib wasi_03_async_open_at_runs_with_real_wasmtime_host
          WASMTIME_CLI="$RUNNER_TEMP/wasmtime-v49.0.0-x86_64-linux/wasmtime" \
            cargo test --lib wasi_03_read_stream_runs_with_real_wasmtime_host
          WASMTIME_CLI="$RUNNER_TEMP/wasmtime-v49.0.0-x86_64-linux/wasmtime" \
            cargo test --lib wasi_03_bounded_read_bytes_runs_with_real_wasmtime_host
          cargo run --bin calcit -- tests/fixtures/wasi-command-03.cirru test app.main/main! --require-match
          cargo run --bin calcit -- tests/fixtures/wasi-command-03.cirru test app.main/transform-content --require-match
          cargo run --bin calcit -- tests/fixtures/wasi-command-03.cirru test app.main/read-workspace-file --require-match
          cargo run --bin calcit -- tests/fixtures/wasi-command-03.cirru test app.main/write-workspace-file --require-match
          cargo run --bin calcit -- tests/fixtures/wasi-command-03-get-args.cirru test app.main/main! --require-match
          cargo run --bin calcit -- tests/fixtures/wasi-command-03-get-env.cirru test app.main/main! --require-match
          cargo build --bin calcit
          WASMTIME_CLI="$RUNNER_TEMP/wasmtime-v49.0.0-x86_64-linux/wasmtime" \
            bash scripts/test-wasi-manifest-component.sh

  wasi_business_smoke:
    name: Published WASI HTTP business loop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install published Calcit 0.18.0
        run: cargo install calcit --version 0.18.0 --locked
      - name: Install published calcit-bindgen 0.1.7
        run: cargo install calcit-bindgen --version 0.1.7 --locked
      - name: Run the published-version business loop
        run: bash scripts/test-published-wasi-http-business.sh

  macos_main_thread:
    name: macOS main-thread CLI
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --bin calcit
      - name: Verify the reserved process-main stack
        run: |
          stacksize=$(otool -l target/debug/calcit | awk '/cmd LC_MAIN/{main=1} main && /stacksize/{print $2; exit}')
          test "$stacksize" = "33554432"
      - run: ./target/debug/calcit -v

  # Rust unit/integration tests are the longest leg, so they keep a dedicated
  # job that runs unchanged alongside the CLI, docs, and lint jobs below.
  rust_tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo test
        env:
          RUST_MIN_STACK: "16777216"

      - name: "check wasm32 library dependency boundary"
        run: cargo check --lib --target wasm32-unknown-unknown

  core_checks:
    name: Core and CLI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@v2

      - name: "run definition-attached core tests"
        run: cargo run --bin calcit -- src/cirru/calcit-core.cirru test --tag unit --require-match

      - name: "strictly check bundled core source definitions"
        run: cargo run --bin calcit -- calcit/test-wasi-command.cirru analyze check-public --ns calcit.core --ns calcit.test --ns calcit.internal --deps --summary-only

      - name: "verify bundled core Dynamic boundary documentation"
        run: cargo build --bin calcit && node scripts/core-dynamic-classification.mjs --check

      - name: "verify strict diagnostics default and compatibility escape hatch"
        run: node scripts/check-strict-default.mjs

      - name: "verify release manifest generator"
        run: node --test scripts/release-manifest.test.mjs

      - run: cargo run --bin calcit -- calcit/test.cirru

      - name: "verify WASM exports and FFI"
        run: >
          cargo build --bin calcit
          && CALCIT_BIN="./target/debug/calcit" bash scripts/test-wasm.sh

      - name: "try js"
        run: >
          yarn
          && yarn tsc
          && cargo run --bin calcit -- calcit/test.cirru js
          && ln -s ../../ node_modules/@calcit/procs
          && cp -v scripts/main.mjs js-out/
          && node js-out/main.mjs
          && bash scripts/test-js-command.sh

  docs_checks:
    name: Docs checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@v2

      - name: Build calcit debug binary
        run: cargo build --bin calcit

      - name: "check docs markdown"
        run: bash scripts/check-docs-md.sh
        env:
          RUST_MIN_STACK: "16777216"

      - name: Detect documentation changes
        id: docs_changes
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            set +e
            git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- docs/
            status=$?
            set -e
            case "$status" in
              0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
              1) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::Unable to compare pushed range"; exit "$status" ;;
            esac
          fi

      - name: Deploy CalcitAgent.md to server
        if: steps.docs_changes.outputs.changed == 'true'
        id: deploy
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "docs/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}/docs"

      - name: Display status from deploy
        run: echo "${{ steps.deploy.outputs.status }}"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy -- -D warnings

  # Preserve the pre-split required check name: this aggregate job is green
  # only when every shard above succeeded.
  Test:
    name: Test
    if: ${{ always() }}
    needs:
      - wasi_preprocess
      - wasi03_command_smoke
      - wasi_business_smoke
      - rust_tests
      - core_checks
      - docs_checks
      - clippy
    runs-on: ubuntu-latest
    steps:
      - name: Verify all shards succeeded
        run: |
          echo "wasi_preprocess=${{ needs.wasi_preprocess.result }}"
          echo "wasi03_command_smoke=${{ needs.wasi03_command_smoke.result }}"
          echo "rust_tests=${{ needs.rust_tests.result }}"
          echo "wasi_business_smoke=${{ needs.wasi_business_smoke.result }}"
          echo "core_checks=${{ needs.core_checks.result }}"
          echo "docs_checks=${{ needs.docs_checks.result }}"
          echo "clippy=${{ needs.clippy.result }}"
          test "${{ needs.wasi_preprocess.result }}" = "success"
          test "${{ needs.wasi03_command_smoke.result }}" = "success"
          test "${{ needs.rust_tests.result }}" = "success"
          test "${{ needs.wasi_business_smoke.result }}" = "success"
          test "${{ needs.core_checks.result }}" = "success"
          test "${{ needs.docs_checks.result }}" = "success"
          test "${{ needs.clippy.result }}" = "success"
