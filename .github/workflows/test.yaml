on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

jobs:
  wasi_preprocess:
    name: WASI preprocess regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Install Wasmtime 18.0.3
        uses: bytecodealliance/actions/wasmtime/setup@v1.1.3
        with:
          version: "18.0.3"
      - name: Verify native and WASI preprocessing parity
        run: bash scripts/test-wasi-preprocess.sh

  macos_main_thread:
    name: macOS main-thread CLI
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --bin calcit
      - name: Verify the reserved process-main stack
        run: |
          stacksize=$(otool -l target/debug/calcit | awk '/cmd LC_MAIN/{main=1} main && /stacksize/{print $2; exit}')
          test "$stacksize" = "33554432"
      - run: ./target/debug/calcit -v

  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo test
        env:
          RUST_MIN_STACK: "16777216"
      - name: "check wasm32 library dependency boundary"
        run: cargo check --lib --target wasm32-unknown-unknown
      - name: "run definition-attached core tests"
        run: cargo run --bin calcit -- src/cirru/calcit-core.cirru --compat-types test --tag unit
      - name: "prevent bundled core type-debt regressions"
        run: cargo run --bin calcit -- src/cirru/calcit-core.cirru analyze quality --baseline config/calcit-core-quality.cirru --format json
      - name: "prevent bundled core Dynamic classification drift"
        run: cargo build --bin calcit && node scripts/core-dynamic-classification.mjs --check
      - name: "verify strict diagnostics default and compatibility escape hatch"
        run: node scripts/check-strict-default.mjs
      - run: cargo run --bin calcit -- calcit/test.cirru --compat-types

      - name: "verify WASM exports and FFI"
        run: >
          cargo build --bin cr-wasm
          && CR_WASM_BIN="./target/debug/cr-wasm" bash scripts/test-wasm.sh

      - uses: giraffate/clippy-action@v1
        with:
          reporter: "github-pr-review"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: "check docs markdown"
        run: bash scripts/check-docs-md.sh
        env:
          RUST_MIN_STACK: "16777216"

      - name: "try js"
        run: >
          yarn
          && yarn tsc
          && cargo run --bin calcit -- calcit/test.cirru --compat-types js
          && ln -s ../../ node_modules/@calcit/procs
          && cp -v scripts/main.mjs js-out/
          && node js-out/main.mjs

      - name: Detect documentation changes
        id: docs_changes
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- docs/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy CalcitAgent.md to server
        if: steps.docs_changes.outputs.changed == 'true'
        id: deploy
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "docs/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}/docs"

      - name: Display status from deploy
        run: echo "${{ steps.deploy.outputs.status }}"
