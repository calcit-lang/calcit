on:
  release:
    types: [created]

name: Publish to crate

permissions:
  contents: write
  id-token: write  # Required for OIDC

jobs:
  publish:
    name: Publish to cargo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Set sparse registry protocol
        run: echo "CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse" >> $GITHUB_ENV

      - run: cargo test
        env:
          RUST_MIN_STACK: "16777216"
      - name: "run definition-attached core tests"
        run: cargo run --bin calcit -- src/cirru/calcit-core.cirru test --tag unit
      - name: "prevent bundled core type-debt regressions"
        run: cargo run --bin calcit -- src/cirru/calcit-core.cirru analyze quality --baseline config/calcit-core-quality.json --format json
      - run: cargo run --bin calcit -- calcit/test.cirru

      - name: "verify WASM exports and FFI"
        run: >
          cargo build --bin cr-wasm
          && CR_WASM_BIN="./target/debug/cr-wasm" bash scripts/test-wasm.sh

      - name: "try js"
        run: >
          yarn
          && yarn tsc
          && cargo run --bin calcit -- calcit/test.cirru js
          && ln -s ../../ node_modules/@calcit/procs
          && cp -v scripts/main.mjs js-out/
          && node js-out/main.mjs

      - name: "check docs markdown"
        run: bash scripts/check-docs-md.sh

      - run: cargo build --release

      - name: Generate release asset manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >
          node scripts/release-manifest.mjs "$RELEASE_TAG"
          target/release/calcit target/release/cr-wasm
          > target/release/calcit-release-manifest.json

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/calcit
            target/release/cr-wasm
            target/release/calcit-release-manifest.json

      - uses: katyo/publish-crates@v1
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          args: --no-verify

      - name: "generate procs.mjs"
        run: yarn && yarn tsc

      # - run: npm publish --provenance --access public --tag next
      - run: npm publish --provenance --access public
