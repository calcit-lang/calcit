on:
  release:
    types: [created]
  workflow_dispatch: {}

name: Publish to crate

permissions:
  contents: read

concurrency:
  group: calcit-registry-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

# The release commit must already be green in the branch Test workflow (full cargo test,
# check-all, docs, WASI, clippy) and CodeQL; `branch_ci` waits for both on the exact SHA instead
# of repeating them. The other gates run in parallel and cover only what branch CI cannot:
# the tag/version/Release identity, the optimized binaries that are shipped, and the
# registry packages as they will be uploaded.
# No rust-cache: caches saved on a tag ref are visible only to that tag, so they are never
# restored by a later release and saving them would only lengthen each job.
jobs:
  verify_source:
    name: Verify release tag and versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      # The workflow, OIDC identity and checkout must all use the same tag.
      - name: Validate workflow source
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$SOURCE_REF" = "refs/tags/$RELEASE_TAG"
      - uses: actions/checkout@v7.0.1
        with:
          # Preserve the annotated tag object instead of fetching its commit into the tag ref.
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify exact release source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-registry.mjs prepare "$RELEASE_TAG"

  branch_ci:
    name: Wait for branch Test and CodeQL
    needs: verify_source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Require green branch CI on the release commit
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify_source.outputs.sha }}
        run: node scripts/publish-registry.mjs ci "$RELEASE_TAG"

  standard_binary:
    name: Build and smoke standard release binary
    needs: verify_source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - uses: dtolnay/rust-toolchain@stable

      - name: Build standard release binary
        run: |
          test "$(uname -m)" = "x86_64"
          grep -F 'VERSION_ID="22.04"' /etc/os-release
          cargo build --locked --release --bin calcit
          mkdir -p target/release/assets
          cp target/release/calcit target/release/assets/calcit
          test "$(target/release/assets/calcit -v)" = "$RELEASE_TAG"

      # Branch CI runs the `ci` profile; these run the optimized binary that is actually shipped.
      - name: Smoke shipped binary on native, JS and WASM backends
        env:
          CALCIT_BIN: target/release/assets/calcit
        run: |
          yarn install --immutable
          yarn compile
          yarn procs-link
          "$CALCIT_BIN" calcit/test.cirru
          "$CALCIT_BIN" calcit/test.cirru js
          cp -v scripts/main.mjs js-out/
          node js-out/main.mjs
          bash scripts/test-wasm.sh

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-standard
          path: target/release/assets/calcit
          if-no-files-found: error
          retention-days: 7

  no_wasm_binary:
    name: Build and smoke Ubuntu 22.04 no-WASM binary
    needs: verify_source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and smoke Ubuntu 22.04 no-WASM release binary
        run: |
          test "$(uname -m)" = "x86_64"
          grep -F 'VERSION_ID="22.04"' /etc/os-release
          mkdir -p target/release/assets
          cargo build --locked --release --no-default-features --bin calcit
          cp target/release/calcit target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm
          file target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm
          ldd target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm
          test "$(target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm -v)" = "$RELEASE_TAG"
          target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm calcit/test.cirru
          target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm --emit-path target/release/no-wasm-js calcit/test.cirru js
          if target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm wasm calcit/test.cirru >target/release/no-wasm-command.out 2>&1; then
            echo 'WASM command unexpectedly succeeded' >&2
            exit 1
          fi
          grep -F 'WASM and WASI code generation are disabled' target/release/no-wasm-command.out
          if target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm wasi calcit/test.cirru >target/release/no-wasm-command.out 2>&1; then
            echo 'WASI command unexpectedly succeeded' >&2
            exit 1
          fi
          grep -F 'WASM and WASI code generation are disabled' target/release/no-wasm-command.out

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-no-wasm
          path: target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm
          if-no-files-found: error
          retention-days: 7

  package_dry_run:
    name: Dry-run crate and npm packages
    needs: verify_source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - uses: dtolnay/rust-toolchain@stable

      # The real upload uses --no-verify, so this is where the packaged crate must build.
      - name: Verify packaged crate builds
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo publish --dry-run --locked

      - name: Verify npm package contents
        run: |
          yarn install --immutable
          yarn compile
          npm pack --dry-run --json > target/npm-pack.json
          node -e '
            const [pack] = JSON.parse(require("fs").readFileSync("target/npm-pack.json", "utf8"));
            const files = new Set(pack.files.map(file => file.path));
            for (const required of ["package.json", "README.md", "lib/calcit.procs.mjs"]) {
              if (!files.has(required)) throw new Error(`npm package is missing ${required}`);
            }
            if (pack.version !== process.env.RELEASE_TAG) throw new Error(`npm package version ${pack.version}`);
          '

  publish:
    name: Publish to cargo
    needs: [verify_source, branch_ci, standard_binary, no_wasm_binary, package_dry_run]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write  # Required for OIDC
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - uses: dtolnay/rust-toolchain@stable

      # Upload exactly the binaries that passed their smoke jobs.
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-standard
          path: target/release/assets
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-no-wasm
          path: target/release/assets

      - name: Generate release asset manifest
        run: |
          chmod +x target/release/assets/calcit target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm
          node scripts/release-manifest.mjs "$RELEASE_TAG" \
            target/release/assets/calcit \
            target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm \
            > target/release/assets/calcit-release-manifest.json

      - name: Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ needs.verify_source.outputs.prerelease == 'true' }}
          files: |
            target/release/assets/calcit
            target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm
            target/release/assets/calcit-release-manifest.json

      - name: Publish or verify exact crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_SHA: ${{ needs.verify_source.outputs.sha }}
        run: node scripts/publish-registry.mjs crate "$RELEASE_TAG"

      - name: "generate procs.mjs"
        run: yarn && yarn tsc

      - name: Publish or verify exact npm runtime
        env:
          RELEASE_SHA: ${{ needs.verify_source.outputs.sha }}
        run: node scripts/publish-registry.mjs npm "$RELEASE_TAG"
