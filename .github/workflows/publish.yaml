on:
  release:
    types: [created]
  workflow_dispatch: {}

name: Publish to crate

permissions:
  contents: write
  actions: read
  id-token: write  # Required for OIDC

concurrency:
  group: calcit-registry-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  publish:
    name: Publish to cargo
    runs-on: ubuntu-22.04

    steps:
      # The workflow, OIDC identity and checkout must all use the same tag.
      - name: Validate workflow source
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$SOURCE_REF" = "refs/tags/$RELEASE_TAG"
      - uses: actions/checkout@v4
        with:
          # Preserve the annotated tag object instead of fetching its commit into the tag ref.
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify exact release source and main CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-registry.mjs prepare "$RELEASE_TAG"

      - name: Set sparse registry protocol
        run: echo "CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse" >> $GITHUB_ENV

      - run: cargo test
        env:
          RUST_MIN_STACK: "16777216"
      - name: "run definition-attached core tests"
        run: cargo run --bin calcit -- src/cirru/calcit-core.cirru test --tag unit --require-match
      - name: "strictly check bundled core source definitions"
        run: cargo run --bin calcit -- calcit/test-wasi-command.cirru analyze check-public --ns calcit.core --ns calcit.test --ns calcit.internal --deps --summary-only
      - name: "verify bundled core Dynamic boundary documentation"
        run: cargo build --bin calcit && node scripts/core-dynamic-classification.mjs --check
      - name: "verify strict diagnostics default and compatibility escape hatch"
        run: |
          yarn install --immutable
          yarn compile
          mkdir -p node_modules/@calcit
          ln -s ../../ node_modules/@calcit/procs
          node scripts/check-strict-default.mjs
      - run: cargo run --bin calcit -- calcit/test.cirru

      - name: "verify WASM exports and FFI"
        run: >
          cargo build --bin calcit
          && CALCIT_BIN="./target/debug/calcit" bash scripts/test-wasm.sh

      - name: "try js"
        run: >
          cargo run --bin calcit -- calcit/test.cirru js
          && cp -v scripts/main.mjs js-out/
          && node js-out/main.mjs
          && node scripts/check-struct-field-js.mjs

      - name: "verify shared Calcit backend contracts"
        run: |
          node --test scripts/core-test-protocol.test.mjs
          node scripts/run-core-tests.mjs
          node scripts/run-core-tests.mjs --snapshot calcit/test-traits.cirru --target test-traits.main/test-qualified-contains-boundary --backend native,js
          node scripts/check-string-unicode.mjs
          node scripts/check-monotonic-clock-js.mjs
          node scripts/check-helper-inference.mjs

      - name: "check docs markdown"
        run: bash scripts/check-docs-md.sh

      - name: Build standard and Ubuntu 22.04 no-WASM release assets
        run: |
          test "$(uname -m)" = "x86_64"
          grep -F 'VERSION_ID="22.04"' /etc/os-release
          mkdir -p target/release/assets
          cargo build --locked --release --bin calcit
          cp target/release/calcit target/release/assets/calcit
          test "$(target/release/assets/calcit -v)" = "$RELEASE_TAG"
          cargo build --locked --release --no-default-features --bin calcit
          cp target/release/calcit target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm
          file target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm
          ldd target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm
          test "$(target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm -v)" = "$RELEASE_TAG"
          target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm calcit/test.cirru
          target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm --emit-path target/release/no-wasm-js calcit/test.cirru js
          if target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm wasm calcit/test.cirru >target/release/no-wasm-command.out 2>&1; then
            echo 'WASM command unexpectedly succeeded' >&2
            exit 1
          fi
          grep -F 'WASM and WASI code generation are disabled' target/release/no-wasm-command.out
          if target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm wasi calcit/test.cirru >target/release/no-wasm-command.out 2>&1; then
            echo 'WASI command unexpectedly succeeded' >&2
            exit 1
          fi
          grep -F 'WASM and WASI code generation are disabled' target/release/no-wasm-command.out

      - name: Generate release asset manifest
        run: >
          node scripts/release-manifest.mjs "$RELEASE_TAG"
          target/release/assets/calcit
          target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm
          > target/release/assets/calcit-release-manifest.json

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          files: |
            target/release/assets/calcit
            target/release/assets/calcit-ubuntu22.04-x86_64-no-wasm
            target/release/assets/calcit-release-manifest.json

      - name: Publish or verify exact crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: node scripts/publish-registry.mjs crate "$RELEASE_TAG"

      - name: "generate procs.mjs"
        run: yarn && yarn tsc

      - name: Publish or verify exact npm runtime
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: node scripts/publish-registry.mjs npm "$RELEASE_TAG"
