
[package]
name = "calcit"
autobins = false
version = "0.46.0"
authors = ["jiyinyiyong <jiyinyiyong@gmail.com>"]
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
description = "Interpreter and JavaScript/WebAssembly codegen for Calcit"
homepage = "http://calcit-lang.org"
documentation = "https://docs.rs/crate/calcit/"
repository = "https://github.com/calcit-lang/calcit"
readme = "README.md"
exclude = [
  ".github/*",
  ".gitattributes",
  ".gitignore",
  ".npmignore",
  ".prettierrc",
  ".rustfmt.toml",
  ".yarnrc.yml",
  "AGENTS.md",
  "RFCs/*",
  "calcit/*",
  "config/*",
  "docs/*",
  "!docs/CalcitAgent.md",
  "editing-history/*",
  "examples/*",
  "js-out/*",
  "lib/*",
  "notes/*",
  "package.json",
  "profiling/*",
  "rust-toolchain.toml",
  "scripts/*",
  "ts-src/*",
  "tsconfig.json",
  "wasm-runtime/*",
  "yarn.lock",
]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# cirru_edn = { path = "/Users/chenyong/repo/cirru/edn.rs" }
# cirru_parser = { path = "/Users/chenyong/repo/cirru/parser.rs" }
argh = "0.1.19"
base64 = "0.22.1"
hex = "0.4.3"
md-5 = "0.11.0"
rpds = "1.2.1"
foldhash = "0.2.0"
finger_vec = "0.1.0"
# finger_vec = { path = "../finger-vec.rs" }
colored = "3.1.1"
strum = "0.25"
strum_macros = "0.25"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
cirru_edn = "0.8.2"
cirru_parser = "=0.2.17"
bisection_key = "0.0.1"
calcit_native_ffi = { version = "0.1.3", default-features = false }
rmp-serde = "1.3.0"
semver = "1.0.28"
regex = "1.13.1"
ryu = "=1.0.23"
wasm-encoder = { version = "=0.258.0", default-features = false, features = ["wasmparser"], optional = true }
wasmparser = { version = "=0.258.0", default-features = false, optional = true }
calcit-bindgen = { version = "=0.1.12", optional = true }

[build-dependencies]
cirru_edn = "0.8.2"
rmp-serde = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }
cirru_parser = "=0.2.17"

[dev-dependencies]
tempfile = "3"
calcit-bindgen = { version = "=0.1.12", features = ["wasmtime-http", "wasmtime-db"] }
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wasmtime = { version = "=48.0.7", default-features = false, features = ["component-model", "component-model-async", "cranelift", "runtime", "std"] }

[features]
default = ["wasm"]
wasm = ["dep:wasm-encoder", "dep:wasmparser", "dep:calcit-bindgen"]
internal-wasi-preprocess-harness = ["wasm"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3.3"
notify = "8.0.0"
notify-debouncer-mini = "0.7.0"
ureq = "3.3.0"
walkdir = "2.5.0"
libloading = "0.9.0"
ctrlc = "3.5.2"

[lib]
name = "calcit"
path = "src/lib.rs"

[[bin]]
name = "calcit"
path = "src/bin/cr.rs"

[[bin]]
name = "calcit-wasi-preprocess-harness"
path = "src/bin/wasi_preprocess_harness.rs"
required-features = ["internal-wasi-preprocess-harness"]

# Used by CI to run the CLI-heavy contract scripts: much faster to run than the debug
# build, much faster to build than `release` (no LTO, parallel codegen units).
# It keeps debug assertions and overflow checks, so tests still catch the panics that
# only a debug build reveals.
[profile.ci]
inherits = "release"
lto = false
opt-level = 1
codegen-units = 16
debug-assertions = true
overflow-checks = true

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
assigning_clones = "warn"
dbg_macro = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
or_fun_call = "warn"
rc_buffer = "warn"
redundant_clone = "warn"
uninlined_format_args = "warn"
