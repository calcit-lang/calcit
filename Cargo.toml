
[package]
name = "calcit"
autobins = false
version = "0.15.6"
authors = ["jiyinyiyong <jiyinyiyong@gmail.com>"]
edition = "2024"
license = "MIT"
description = "Interpreter and JavaScript/WebAssembly codegen for Calcit"
homepage = "http://calcit-lang.org"
documentation = "https://docs.rs/crate/calcit/"
repository = "https://github.com/calcit-lang/calcit"
readme = "README.md"
exclude = [
  ".github/*",
  ".gitattributes",
  ".gitignore",
  ".npmignore",
  ".prettierrc",
  ".yarnrc.yml",
  "AGENTS.md",
  "RFCs/*",
  "calcit/*",
  "config/*",
  "docs/*",
  "!docs/CalcitAgent.md",
  "editing-history/*",
  "js-out/*",
  "lib/*",
  "notes/*",
  "package.json",
  "profiling/*",
  "scripts/*",
  "ts-src/*",
  "tsconfig.json",
  "yarn.lock",
]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# cirru_edn = { path = "/Users/chenyong/repo/cirru/edn.rs" }
# cirru_parser = { path = "/Users/chenyong/repo/cirru/parser.rs" }
argh = "0.1.19"
hex = "0.4.3"
md-5 = "0.11.0"
rpds = "1.2.1"
im_ternary_tree = "0.0.21"
# im_ternary_tree = { path = "/Users/chenyong/repo/calcit-lang/ternary-tree.rs" }
colored = "3.1.1"
strum = "0.25"
strum_macros = "0.25"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
cirru_edn = "0.8.2"
cirru_parser = "=0.2.17"
bisection_key = "0.0.1"
calcit_native_ffi = { version = "0.1.3", default-features = false }
rmp-serde = "1.3.0"
semver = "1.0.28"
regex = "1.13.1"
wasm-encoder = { version = "0.256.0", default-features = false }

[build-dependencies]
cirru_edn = "0.8.2"
rmp-serde = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }
cirru_parser = "=0.2.17"

[dev-dependencies]
calcit-bindgen = { version = "0.1.3", features = ["wasmtime-http"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wasmtime = { version = "=47.0.4", default-features = false, features = ["component-model", "component-model-async", "cranelift", "runtime", "std"] }

[features]
internal-wasi-preprocess-harness = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3.3"
notify = "8.0.0"
notify-debouncer-mini = "0.7.0"
ureq = "3.3.0"
walkdir = "2.5.0"
libloading = "0.9.0"
ctrlc = "3.5.2"

[lib]
name = "calcit"
path = "src/lib.rs"

[[bin]]
name = "calcit"
path = "src/bin/cr.rs"

[[bin]]
name = "calcit-wasi-preprocess-harness"
path = "src/bin/wasi_preprocess_harness.rs"
required-features = ["internal-wasi-preprocess-harness"]

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
